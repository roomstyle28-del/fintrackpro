<!DOCTYPE html>
<html lang="id">
<head>
<link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFinance - Kelola Anggaran Keluarga</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Icon Components using Lucide
        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        const formatIDR = (val) => {
            if (val === undefined || val === null) return "0";
            return val.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        };

        const parseNumber = (val) => {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            const clean = val.replace(/\./g, '').replace(/,/g, '');
            return parseInt(clean) || 0;
        };

        function App() {
            // State Utama
            const [salary, setSalary] = useState(10000000);
            const [categories, setCategories] = useState([
                {
                    id: 'cat-wife',
                    title: 'Anggaran Istri',
                    allocated: 3000000,
                    items: [
                        { id: 'sub-1', name: 'Belanja Dapur', amount: 2000000, isCalculated: true },
                        { id: 'sub-2', name: 'Skincare', amount: 500000, isCalculated: true }
                    ]
                }
            ]);
            const [savingsTarget, setSavingsTarget] = useState(1000000);
            const [history, setHistory] = useState([]);
            const [currentMonth, setCurrentMonth] = useState(new Date().toLocaleString('id-ID', { month: 'long', year: 'numeric' }));
            
            // UI State
            const [draggedItem, setDraggedItem] = useState(null);
            const [showHistoryModal, setShowHistoryModal] = useState(false);

            useEffect(() => {
                const saved = localStorage.getItem('finance_history_v2');
                if (saved) setHistory(JSON.parse(saved));
                lucide.createIcons();
            }, []);

            const totals = useMemo(() => {
                let totalSpent = 0;
                categories.forEach(cat => {
                    cat.items.forEach(item => {
                        if (item.isCalculated) totalSpent += item.amount;
                    });
                });
                return {
                    spent: totalSpent,
                    remaining: salary - totalSpent,
                    afterSavings: salary - totalSpent - savingsTarget
                };
            }, [salary, categories, savingsTarget]);

            const saveToHistory = () => {
                const record = {
                    id: currentMonth,
                    updatedAt: Date.now(),
                    month: currentMonth,
                    salary,
                    categories: JSON.parse(JSON.stringify(categories)),
                    savingsTarget
                };

                const existingIndex = history.findIndex(h => h.id === currentMonth);
                let newHistory;
                
                if (existingIndex >= 0) {
                    newHistory = [...history];
                    newHistory[existingIndex] = record;
                } else {
                    newHistory = [record, ...history];
                }

                setHistory(newHistory);
                localStorage.setItem('finance_history_v2', JSON.stringify(newHistory));
                alert(`Data "${currentMonth}" berhasil disimpan!`);
            };

            const loadHistory = (record) => {
                setSalary(record.salary);
                setCategories(record.categories);
                setSavingsTarget(record.savingsTarget);
                setCurrentMonth(record.month);
                setShowHistoryModal(false);
            };

            const deleteHistory = (e, id) => {
                e.stopPropagation();
                const newHistory = history.filter(h => h.id !== id);
                setHistory(newHistory);
                localStorage.setItem('finance_history_v2', JSON.stringify(newHistory));
            };

            const addCategory = () => {
                setCategories([...categories, { id: `cat-${Date.now()}`, title: 'Kategori Baru', allocated: 0, items: [] }]);
            };

            const deleteCategory = (catId) => {
                setCategories(categories.filter(c => c.id !== catId));
            };

            const addItem = (catId) => {
                setCategories(categories.map(cat => {
                    if (cat.id === catId) {
                        return {
                            ...cat,
                            items: [...cat.items, { id: `item-${Date.now()}`, name: 'Item Baru', amount: 0, isCalculated: true }]
                        };
                    }
                    return cat;
                }));
            };

            const updateItem = (catId, itemId, field, value) => {
                setCategories(categories.map(cat => {
                    if (cat.id === catId) {
                        return {
                            ...cat,
                            items: cat.items.map(item => {
                                if (item.id === itemId) {
                                    const newVal = field === 'amount' ? parseNumber(value) : value;
                                    return { ...item, [field]: newVal };
                                }
                                return item;
                            })
                        };
                    }
                    return cat;
                }));
            };

            const deleteItem = (catId, itemId) => {
                setCategories(categories.map(cat => {
                    if (cat.id === catId) {
                        return { ...cat, items: cat.items.filter(i => i.id !== itemId) };
                    }
                    return cat;
                }));
            };

            // Drag and Drop Logic
            const onDragStart = (e, item, sourceCatId) => setDraggedItem({ item, sourceCatId });
            const onDragOver = (e) => e.preventDefault();
            const onDrop = (e, targetCatId) => {
                e.preventDefault();
                if (!draggedItem) return;
                const { item, sourceCatId } = draggedItem;
                if (sourceCatId === targetCatId) return;

                setCategories(categories.map(cat => {
                    if (cat.id === sourceCatId) return { ...cat, items: cat.items.filter(i => i.id !== item.id) };
                    if (cat.id === targetCatId) return { ...cat, items: [...cat.items, item] };
                    return cat;
                }));
                setDraggedItem(null);
            };

            return (
                <div className="min-h-screen pb-24 md:pb-12">
                    {/* Top Header */}
                    <header className="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-4 md:px-12">
                        <div className="max-w-6xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-2">
                                <Icon name="pie-chart" className="w-7 h-7 text-indigo-600" />
                                <h1 className="text-xl font-extrabold tracking-tighter text-slate-900">Finanku</h1>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setShowHistoryModal(true)}
                                    className="p-3 bg-slate-100 text-slate-600 rounded-full hover:bg-slate-200 transition"
                                >
                                    <Icon name="folder-open" />
                                </button>
                                <button 
                                    onClick={saveToHistory}
                                    className="px-5 py-2.5 bg-indigo-600 text-white rounded-full font-bold text-sm flex items-center gap-2 shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition"
                                >
                                    <Icon name="save" className="w-4 h-4" /> Simpan
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto p-4 md:p-8 space-y-8">
                        {/* Summary Section */}
                        <section className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="bg-white p-6 rounded-[2.5rem] border border-slate-200/60 shadow-sm">
                                <div className="space-y-5">
                                    <div className="flex items-center justify-between">
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Pemasukan</span>
                                        <input 
                                            type="text" 
                                            value={currentMonth}
                                            onChange={(e) => setCurrentMonth(e.target.value)}
                                            className="text-[10px] font-bold text-indigo-500 bg-indigo-50 px-2.5 py-1 rounded-full outline-none"
                                        />
                                    </div>
                                    <div className="relative">
                                        <span className="absolute left-0 top-1/2 -translate-y-1/2 text-slate-300 font-bold text-xl">Rp</span>
                                        <input 
                                            type="text"
                                            className="w-full pl-8 pr-4 py-1 bg-transparent text-3xl font-black text-slate-800 outline-none transition"
                                            value={formatIDR(salary)}
                                            onChange={(e) => setSalary(parseNumber(e.target.value))}
                                        />
                                    </div>
                                    <div className="pt-4 border-t border-slate-50">
                                        <label className="text-[10px] font-bold text-slate-400 uppercase mb-2 block tracking-wider">Target Tabungan</label>
                                        <div className="flex items-center gap-2">
                                            <span className="text-emerald-500 font-bold">Rp</span>
                                            <input 
                                                type="text"
                                                className="w-full p-0 bg-transparent text-emerald-600 font-black text-lg outline-none"
                                                value={formatIDR(savingsTarget)}
                                                onChange={(e) => setSavingsTarget(parseNumber(e.target.value))}
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="md:col-span-2 bg-indigo-600 rounded-[2.5rem] p-8 text-white flex flex-col justify-between shadow-2xl shadow-indigo-200 overflow-hidden relative">
                                <div className="absolute top-0 right-0 p-12 opacity-10 rotate-12">
                                    <Icon name="dollar-sign" className="w-32 h-32" />
                                </div>
                                <div className="relative z-10">
                                    <p className="text-indigo-200 text-xs font-black uppercase tracking-widest mb-1">Sisa Anggaran Akhir</p>
                                    <h2 className="text-5xl font-black tracking-tighter">Rp {formatIDR(totals.afterSavings)}</h2>
                                </div>
                                <div className="relative z-10 grid grid-cols-2 gap-8 pt-8 mt-8 border-t border-white/10">
                                    <div>
                                        <p className="text-indigo-200 text-[10px] font-bold uppercase tracking-widest">Total Belanja</p>
                                        <p className="text-xl font-bold">Rp {formatIDR(totals.spent)}</p>
                                    </div>
                                    <div>
                                        <p className="text-indigo-200 text-[10px] font-bold uppercase tracking-widest">Saldo Murni</p>
                                        <p className="text-xl font-bold text-emerald-300 tracking-tight">Rp {formatIDR(totals.remaining)}</p>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* List Anggaran */}
                        <section className="space-y-6">
                            {categories.map((cat) => {
                                const catSpent = cat.items.reduce((acc, i) => acc + (i.isCalculated ? i.amount : 0), 0);
                                const catRemaining = cat.allocated - catSpent;

                                return (
                                    <div 
                                        key={cat.id}
                                        className="bg-white rounded-[2rem] border border-slate-200/80 shadow-sm overflow-hidden"
                                        onDragOver={onDragOver}
                                        onDrop={(e) => onDrop(e, cat.id)}
                                    >
                                        {/* Cat Header */}
                                        <div className="p-5 bg-slate-50/50 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-100">
                                            <div className="flex items-center gap-4">
                                                <div className="p-3 bg-white rounded-2xl shadow-sm text-indigo-500">
                                                    {cat.title.toLowerCase().includes('istri') ? <Icon name="user" /> : <Icon name="baby" />}
                                                </div>
                                                <div>
                                                    <input 
                                                        className="font-black text-slate-800 bg-transparent outline-none text-xl tracking-tight"
                                                        value={cat.title}
                                                        onChange={(e) => setCategories(categories.map(c => c.id === cat.id ? {...c, title: e.target.value} : c))}
                                                    />
                                                    <div className="flex items-center gap-1 text-[10px] font-black text-slate-400 uppercase tracking-wider">
                                                        ALOKASI: Rp
                                                        <input 
                                                            className="bg-transparent border-none p-0 w-28 focus:ring-0 outline-none font-black text-slate-500"
                                                            value={formatIDR(cat.allocated)}
                                                            onChange={(e) => setCategories(categories.map(c => c.id === cat.id ? {...c, allocated: parseNumber(e.target.value)} : c))}
                                                        />
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="flex items-center justify-between sm:justify-end gap-6 pt-4 sm:pt-0 border-t sm:border-none border-slate-100">
                                                <div className="text-right">
                                                    <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Sisa</p>
                                                    <p className={`text-lg font-black tracking-tight ${catRemaining < 0 ? 'text-red-500' : 'text-indigo-600'}`}>
                                                        Rp {formatIDR(catRemaining)}
                                                    </p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => addItem(cat.id)} className="p-2.5 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-100 transition">
                                                        <Icon name="plus" />
                                                    </button>
                                                    <button onClick={() => deleteCategory(cat.id)} className="p-2.5 bg-red-50 text-red-400 rounded-full hover:bg-red-100 transition">
                                                        <Icon name="trash-2" />
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {/* Items List */}
                                        <div className="divide-y divide-slate-50 min-h-[40px]">
                                            {cat.items.map((item) => (
                                                <div 
                                                    key={item.id}
                                                    draggable
                                                    onDragStart={(e) => onDragStart(e, item, cat.id)}
                                                    className="flex items-center gap-4 p-4 hover:bg-slate-50 transition active:bg-slate-100 group"
                                                >
                                                    <div className="cursor-grab p-1 text-slate-200 group-hover:text-slate-400 transition">
                                                        <Icon name="grip-vertical" className="w-4 h-4" />
                                                    </div>
                                                    
                                                    <input 
                                                        type="checkbox"
                                                        checked={item.isCalculated}
                                                        onChange={(e) => updateItem(cat.id, item.id, 'isCalculated', e.target.checked)}
                                                        className="w-5 h-5 rounded-lg border-slate-300 text-indigo-600 focus:ring-0 cursor-pointer"
                                                    />

                                                    <div className="flex-1 flex flex-col sm:flex-row gap-3">
                                                        <input 
                                                            className={`bg-transparent text-sm font-semibold outline-none flex-grow ${!item.isCalculated ? 'text-slate-300 line-through' : 'text-slate-700'}`}
                                                            value={item.name}
                                                            onChange={(e) => updateItem(cat.id, item.id, 'name', e.target.value)}
                                                        />
                                                        <div className="relative sm:w-48">
                                                            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-[10px] font-black text-slate-300 uppercase">Rp</span>
                                                            <input 
                                                                className="w-full pl-9 pr-3 py-1.5 bg-slate-50/80 rounded-xl text-right font-mono text-sm font-bold text-slate-700 outline-none focus:bg-white focus:ring-2 focus:ring-indigo-100 transition"
                                                                value={formatIDR(item.amount)}
                                                                onChange={(e) => updateItem(cat.id, item.id, 'amount', e.target.value)}
                                                            />
                                                        </div>
                                                    </div>

                                                    <button onClick={() => deleteItem(cat.id, item.id)} className="p-2 text-slate-200 hover:text-red-500 sm:opacity-0 group-hover:opacity-100 transition">
                                                        <Icon name="trash-2" className="w-4 h-4" />
                                                    </button>
                                                </div>
                                            ))}
                                            {cat.items.length === 0 && <p className="text-center py-10 text-xs font-bold text-slate-300 uppercase tracking-widest">Klik + untuk menambah rincian</p>}
                                        </div>
                                    </div>
                                );
                            })}

                            <button 
                                onClick={addCategory}
                                className="w-full py-8 border-2 border-dashed border-slate-200 rounded-[2rem] text-slate-400 font-black text-xs uppercase tracking-[0.2em] hover:bg-white hover:border-indigo-300 hover:text-indigo-500 transition flex items-center justify-center gap-3"
                            >
                                <Icon name="plus" className="w-4 h-4" /> Tambah Kelompok Dana
                            </button>
                        </section>
                    </main>

                    {/* Floating Bottom Bar (Mobile) */}
                    <div className="fixed bottom-0 left-0 right-0 md:hidden bg-white/95 backdrop-blur-xl border-t border-slate-100 p-5 flex justify-between items-center shadow-[0_-15px_30px_rgba(0,0,0,0.05)] z-40">
                        <div>
                            <p className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Sisa Dana</p>
                            <p className={`text-xl font-black tracking-tighter ${totals.afterSavings < 0 ? 'text-red-500' : 'text-indigo-600'}`}>
                                Rp {formatIDR(totals.afterSavings)}
                            </p>
                        </div>
                        <button onClick={saveToHistory} className="bg-indigo-600 text-white px-8 py-3 rounded-full font-black text-sm shadow-xl shadow-indigo-100 tracking-tighter">
                            SIMPAN
                        </button>
                    </div>

                    {/* Modal Riwayat */}
                    {showHistoryModal && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-900/40 backdrop-blur-md p-4 transition-all animate-in fade-in">
                            <div className="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-500">
                                <div className="p-7 border-b border-slate-50 flex items-center justify-between bg-slate-50/30">
                                    <h2 className="text-2xl font-black text-slate-900 tracking-tighter flex items-center gap-3">
                                        <Icon name="folder-open" className="text-indigo-600" /> Riwayat
                                    </h2>
                                    <button onClick={() => setShowHistoryModal(false)} className="p-2 hover:bg-slate-100 rounded-full">
                                        <Icon name="x" />
                                    </button>
                                </div>
                                
                                <div className="max-h-[60vh] overflow-y-auto p-4 space-y-4 no-scrollbar">
                                    {history.length === 0 ? (
                                        <div className="text-center py-20 text-slate-300 font-bold uppercase text-[10px] tracking-[0.2em]">Kosong</div>
                                    ) : (
                                        history.map((h) => (
                                            <div 
                                                key={h.id} 
                                                onClick={() => loadHistory(h)}
                                                className="group flex items-center justify-between p-5 bg-slate-50/80 rounded-3xl border border-transparent hover:border-indigo-200 hover:bg-white cursor-pointer transition-all shadow-sm hover:shadow-md"
                                            >
                                                <div className="flex items-center gap-5">
                                                    <div className="bg-white p-4 rounded-2xl shadow-sm text-indigo-600 group-hover:scale-110 transition-transform">
                                                        <Icon name="calendar" />
                                                    </div>
                                                    <div>
                                                        <p className="font-black text-slate-800 text-lg tracking-tight">{h.month}</p>
                                                        <p className="text-[10px] text-slate-400 uppercase font-black tracking-[0.1em]">
                                                            Rp {formatIDR(h.salary)} • {h.categories.length} Kategori
                                                        </p>
                                                    </div>
                                                </div>
                                                <button 
                                                    onClick={(e) => deleteHistory(e, h.id)}
                                                    className="p-3 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-2xl transition"
                                                >
                                                    <Icon name="trash-2" className="w-5 h-5" />
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>
                                <div className="p-8 bg-slate-50/50 text-center">
                                    <p className="text-[10px] text-slate-400 font-black uppercase tracking-[0.2em] leading-relaxed">
                                        Ketuk untuk memuat kembali catatan bulan lalu.
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>
</body>
</html>
